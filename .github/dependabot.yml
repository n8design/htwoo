# Version updates for the website (security updates are configured in the repository settings).
version: 2
updates:
  # Pattern Dump, pinned at an exact version in website/package.json.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    allow:
      - dependency-name: pattern-dump
    commit-message:
      prefix: "chore(deps)"
  # The theme pin (website/theme): a pull request when n8design/htwoo-theme main moves. It is still the hand pin
  # bump: a person merges it, with a merge commit.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
