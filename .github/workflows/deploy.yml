# Builds and deploys htwoo.io. htwoo-core's style guide and htwoo-react's Storybook build with their own
# commands, then Pattern Dump builds the website, whose site config (website/pattern-dump.config.ts) declares
# every part of the deployment. Its output is uploaded as it is.
name: Deploy the website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "htwoo-core/**"
      - "htwoo-react/**"
      - "package.json"
      - "package-lock.json"
      - ".gitmodules"
      - ".github/workflows/deploy.yml"
  # A theme change goes live with its pin bump in htwoo ("chore(deps): Bump htwoo-theme to <sha>"), which
  # changes website/theme. Run by hand, this redeploys.
  workflow_dispatch:

# One run at a time, in order. A newer trigger replaces a run still waiting, so the last one wins.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's address
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install the workspace
        run: npm ci --no-audit --no-fund

      - name: Build the hTWOo Core style guide
        run: npm run pl:publish-docs -w htwoo-core

      - name: Build the hTWOo React Storybook
        run: npm run build-storybook -w htwoo-react

      - name: Install the website
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Build the website
        working-directory: website
        env:
          # The address the site is served at; a fork serves under a path.
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
